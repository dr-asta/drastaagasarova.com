<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dr. Asta Agasarova | Medical Aesthetics</title>
  <meta name="description" content="Dr. Asta Agasarova - Medical Aesthetics">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1ed;
      font-family: Arial, Helvetica, sans-serif;
      color: #292929;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 0 auto 45px;
    }

    .coming-soon {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a58f70;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;

      color: #a58f70;
      text-decoration: none;

      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      transition: opacity 0.2s ease;
    }

    .instagram svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .instagram:hover {
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      main {
        padding: 30px 20px;
      }

      .logo {
        margin-bottom: 30px;
      }

      .coming-soon {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main>
    <img
      src="logo.png"
      alt="Dr. Asta Agasarova Medical Aesthetics"
      class="logo"
    >

    <h1 class="coming-soon">Coming Soon</h1>

    <a
      class="instagram"
      href="https://www.instagram.com/dr.asta.agasarova/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Follow Dr. Asta Agasarova on Instagram"
    >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3h10zm-5 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm5.5-3.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/>
    </svg>

    <span>Follow on Instagram</span>
  </a>
  
</main>

</body>
</html>
