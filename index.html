<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dr. Asta Agasarova | Medical Aesthetics</title>
  <meta name="description" content="Dr. Asta Agasarova - Medical Aesthetics">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1ed;
      font-family: Arial, Helvetica, sans-serif;
      color: #292929;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 0 auto 45px;
    }

    .coming-soon {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a58f70;
    }

    @media (max-width: 600px) {
      main {
        padding: 30px 20px;
      }

      .logo {
        margin-bottom: 30px;
      }

      .coming-soon {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main>
    <img
      src="logo.png"
      alt="Dr. Asta Agasarova Medical Aesthetics"
      class="logo"
    >

    <h1 class="coming-soon">Coming Soon</h1>
  </main>

</body>
</html>
